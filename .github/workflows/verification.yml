name: Repository and reader verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional schema validator
        run: python3 -m pip install 'jsonschema==4.23.0'
      - name: Check repository, six suites, three corpora, schemas and examples
        run: ./scripts/check-full.sh "$RUNNER_TEMP/agsdl-verification"
      - name: Retain logs, reports and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agsdl-verification
          path: ${{ runner.temp }}/agsdl-verification
          if-no-files-found: warn
